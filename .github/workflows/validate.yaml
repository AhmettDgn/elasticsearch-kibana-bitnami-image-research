name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Static Helm tests
        run: ./tests/static/run.sh
      - name: Detect likely committed secrets
        uses: gitleaks/gitleaks-action@v2
